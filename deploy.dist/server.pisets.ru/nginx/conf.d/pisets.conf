server {
    listen 80;
    server_name pisets.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
            return 301 https://pisets.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name pisets.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pisets.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pisets.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    root /opt/server/dist/apps/front/browser;

    index index.html;

    location ~ ^/(api|files)/ {
        proxy_pass http://api_pisets:3040;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Host $http_host;
#	proxy_pass_request_headers on;
#	real_ip_header X-Forwarded-For;
        proxy_redirect off;
    }

    location /pgadmin4/ {
        proxy_set_header X-Script-Name /pgadmin4;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header Host $host;
        proxy_pass http://pg_admin_pisets/;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://front_pisets:4200;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Host $host;
        proxy_redirect off;

	    add_header Last-Modified $upstream_http_date;
#	add_header Expires $upstream_http_date;
#	add_header Cache-Control no-cache;
    	if_modified_since off;
    }

}

server {
    listen 80 default_server;
    server_name _;
    # deny all
    location / {
        return 403;
    }
}

server {
    listen 443 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/pisets.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pisets.ru/privkey.pem;
    # deny all
    location / {
        return 403;
    }
}

